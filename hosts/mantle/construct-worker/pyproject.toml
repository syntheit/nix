[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "construct-worker"
version = "0.1.0"
description = "Pull worker for construct's job queue on mantle: memo transcription (faster-whisper) and titles (Ollama)"
requires-python = ">=3.11"
dependencies = ["faster-whisper", "requests"]

[project.scripts]
construct-worker = "construct_worker.main:main"

[tool.setuptools]
packages = ["construct_worker"]
