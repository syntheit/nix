# OnePlus 6T (fajita) UCM top-level.
# Derived from gitlab.com/sdm845-mainline/alsa-ucm-conf @ 45cb4c6
# (ucm2/OnePlus/fajita/fajita.conf), with local changes:
#  - dropped Include of /lib/card-init.conf + /lib/ctl-remap.conf: card-init
#    exec's /bin/rm + /bin/mkdir, which don't exist on NixOS, failing the verb.
#    They only provide ctl-remap persistence, not routing.
Syntax 4

SectionUseCase."HiFi" {
	File "/OnePlus/fajita/HiFi.conf"
	Comment "HiFi quality Music."
}

SectionUseCase."Voice Call" {
	File "/OnePlus/fajita/VoiceCall.conf"
	Comment "Make a phone call"
}

BootSequence [
	# Earpiece Volume
	cset "name='RX0 Digital Volume' 75"

	# Headphones Volume
	cset "name='RX1 Digital Volume' 75"
	cset "name='RX2 Digital Volume' 75"

	# Headphones Mic Analog and Digital Volumes
	cset "name='ADC2 Volume' 16"
	cset "name='DEC0 Volume' 75"

	# Phone Bottom Mic Analog and Digital Volumes
	cset "name='ADC4 Volume' 16"
	cset "name='DEC7 Volume' 75"

	# Phone Top Mic Analog and Digital Volumes
	cset "name='ADC3 Volume' 16"
	cset "name='DEC6 Volume' 75"
]
