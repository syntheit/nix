# Megapixels/libmegapixels device config for the OnePlus 6T (fajita).
# First one in existence — adapted from libmegapixels' oneplus,enchilada.conf
# (rear pipeline verbatim; same SoC wiring verified via media-ctl on-device,
# see ~/fajita-notes/camera-tests/phase-0/) + a Front section that upstream
# never wrote. Bayer order verified on-device: both sensors enumerate
# MEDIA_BUS_FMT_SRGGB10_1X10 -> RGGB10P.
#
# Iteration is rebuild-free: this installs to /etc/megapixels/config/ which
# libmegapixels checks before its bundled configs.
#
# NB: Megapixels drives V4L2 directly (no libcamera) -> NO autofocus here.
# Snapshot is the AF daily shooter; Megapixels is the raw-DNG/flash tool.
# For focused Megapixels shots: `fajita-focus set N --hold` alongside.
Version = 1;
Make: "OnePlus";
Model: "6T";

Rear: {
    SensorDriver: "imx376 17-0010";
    BridgeDriver: "qcom-camss";
    # pmi8998 dual LED. Megapixels writes 1 to <FlashPath>/flash_strobe;
    # the kernel LED-flash class self-terminates the strobe. udev rule in
    # camera.nix makes flash_strobe group-video writable.
    FlashPath: "/sys/class/leds/white:flash";
    # EXIF only:
    FocalLength: 4.25;
    FNumber: 1.7;

    Modes: (
        {
            Width: 2592;
            Height: 1940;
            Rate: 30;
            Format: "RGGB10P";
            Rotate: 270;
            Transfer: "srgb";

            Pipeline: (
                # sensor->csiphy link is IMMUTABLE (always enabled) on this
                # kernel; setting it fails with a warning, so it is omitted.
                {Type: "Link", From: "msm_csiphy1", FromPad: 1, To: "msm_csid0", ToPad: 0},
                {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},

                {Type: "Mode", Entity: "imx376 17-0010"},
                {Type: "Mode", Entity: "msm_csiphy1"},
                {Type: "Mode", Entity: "msm_csid0"},
                {Type: "Mode", Entity: "msm_vfe0_rdi0"}
            );
        }
    );
};

Front: {
    SensorDriver: "imx371 16-0010";
    BridgeDriver: "qcom-camss";
    # No LED on the front — use the display as flash (stock = white;
    # phase 5c patches Megapixels for a warm tint).
    FlashDisplay: true;
    FocalLength: 3.6;
    FNumber: 2.0;

    Modes: (
        {
            Width: 4656;
            Height: 3496;
            Rate: 30;
            Format: "RGGB10P";
            Rotate: 90;
            Mirror: true;
            Transfer: "srgb";

            Pipeline: (
                # sensor->csiphy link is IMMUTABLE (always enabled) on this
                # kernel; setting it fails with a warning, so it is omitted.
                {Type: "Link", From: "msm_csiphy2", FromPad: 1, To: "msm_csid0", ToPad: 0},
                {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},

                {Type: "Mode", Entity: "imx371 16-0010"},
                {Type: "Mode", Entity: "msm_csiphy2"},
                {Type: "Mode", Entity: "msm_csid0"},
                {Type: "Mode", Entity: "msm_vfe0_rdi0"}
            );
        }
    );
};
