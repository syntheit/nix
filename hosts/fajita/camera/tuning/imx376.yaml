# SPDX-License-Identifier: CC0-1.0
# STATUS (2026-08-13): Ccm RE-ENABLED with the SOFTENED matrix after the
# night-violet root cause was fixed (patches 12/13/15 + blackLevel=4096). See
# the block comment above the Ccm entry below for the swap-to-full recipe.
# NOTE (fajita, 2026-07-17): OUR OWN Ccm, derived Phase 4 from a 24-patch
# ColorChecker on a calibrated MacBook screen (dark room), shot raw on this
# IMX376, solved least-squares (rows sum to 1 → neutrals preserved). Raw fit
# was excellent (~7.9/255) BUT the full-strength matrix tinted real scenes:
# strong off-diagonals amplify the runtime gray-world AWB's per-scene gain
# mismatch → magenta highlights + green midtones (worst where the
# green-heavy sensor clips first). Screen narrowband-green also over-drives
# the matrix vs broadband real-world reflectance. So the shipped matrix is
# blended 50% toward identity: M' = 0.5*I + 0.5*M_solved. Keeps the
# saturated-color correction (deep blues, reds) that clearly works, stops
# amplifying the neutral tint. The raw solved matrix is in git history +
# phase-4 notes if we later improve the AWB or shoot a real chart.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      # 4096 = 64/1023, the IMX376's nominal pedestal (pmOS-derived).
      # History: July 2026 inflated this to 4864 (toe index 76) as
      # night-violet step 1 — the toe widening hid pedestal-times-gain glow
      # because the debayer LUTs applied AWB gains BEFORE subtracting black.
      # Patch 13 (2026-08-11) fixed the LUTs to subtract black first, which
      # made the inflation pure signal loss: in dim scenes most real signal
      # sits just above the pedestal, and crushing raw 64..76 plus losing
      # the former violet "shadow lift" read as "really really dark" in the
      # field. Reverted to the true pedestal same day. Refine per-channel
      # after the dark-frame calibration.
      blackLevel: 4096
  - Awb:
  # Ccm RE-ENABLED (2026-08-13) — SOFTENED matrix (M' = 0.5*I + 0.5*M_solved).
  # Parked 2026-07-17 because dark scenes rendered violet; that root cause is
  # now fully fixed (patch 12 AWB stats black-offset units, patch 13 subtract
  # black before gain in the debayer LUTs — incl. the CCM path re-anchored to
  # the green zero-point, patch 15 analogue gain 1-16x, blackLevel reverted to
  # 4096). Field symptom without CCM: flat green-grey daylight cast + low
  # saturation (channel means ~151/165/155, green leads R by ~14) = classic
  # missing-CCM look. Pipeline order matters: Awb must precede Ccm so the
  # debayer's combinedMatrix = ccm * gainMatrix (patch 13 assumes exactly this
  # and folds greenZero - M*black into the green LUT — no double-apply).
  # Enabling Ccm also flips context.ccmEnabled=true, which lets Adjust's
  # saturation boost run. Starting SOFTENED (halves the off-diagonal ×
  # AWB-gain-mismatch tint that made the FULL matrix throw magenta highlights
  # / green midtones on some scenes) so Daniel can judge with less tint risk.
  # To swap to the FULL solved matrix (deeper blues/reds, more tint risk),
  # replace the ccm row below with:
  #   ccm: [  1.64895, -0.69694,  0.04799,
  #          -0.26600,  1.62365, -0.35765,
  #          -0.16022, -0.61066,  1.77088 ]
  # Both matrices: 24-patch ColorChecker on a MacBook screen, least-squares,
  # rows sum to 1 (neutrals preserved). Full in git 4c946d8, softened 24ba63f.
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [  1.32448, -0.34847,  0.02400,
                 -0.13300,  1.31183, -0.17883,
                 -0.08011, -0.30533,  1.38544 ]
  - Adjust:
  - Agc:
  # Contrast-detect autofocus (phase-3 vendored patches; drives the
  # lc898217xc VCM). Auto-starts via the focus-loss detector — no
  # AfTrigger needed, so Snapshot gets AF passively. Rear sensor only:
  # the front imx371 has no lens, so its tuning file must NOT list Af.
  - Af:
...
