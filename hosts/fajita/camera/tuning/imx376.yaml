# NOTE (fajita, 2026-07-17): OUR OWN Ccm, derived Phase 4 from a 24-patch
# ColorChecker on a calibrated MacBook screen (dark room), shot raw on this
# IMX376, solved least-squares (rows sum to 1 → neutrals preserved). Raw fit
# was excellent (~7.9/255) BUT the full-strength matrix tinted real scenes:
# strong off-diagonals amplify the runtime gray-world AWB's per-scene gain
# mismatch → magenta highlights + green midtones (worst where the
# green-heavy sensor clips first). Screen narrowband-green also over-drives
# the matrix vs broadband real-world reflectance. So the shipped matrix is
# blended 50% toward identity: M' = 0.5*I + 0.5*M_solved. Keeps the
# saturated-color correction (deep blues, reds) that clearly works, stops
# amplifying the neutral tint. The raw solved matrix is in git history +
# phase-4 notes if we later improve the AWB or shoot a real chart.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  # Ccm PARKED (2026-07-17 night): the violet-night bug lives BELOW the CCM
  # (no-CCM diagnostic frame still violet at near-neutral gains; green
  # crushed in the raw-to-render path at low signal — suspected per-channel
  # black-level/gamma residue). Re-enable after that's fixed; both solved
  # matrices are in git history (full: 81e388e^, softened: 81e388e).
  - Adjust:
  - Agc:
  # Contrast-detect autofocus (phase-3 vendored patches; drives the
  # lc898217xc VCM). Auto-starts via the focus-loss detector — no
  # AfTrigger needed, so Snapshot gets AF passively. Rear sensor only:
  # the front imx371 has no lens, so its tuning file must NOT list Af.
  - Af:
...
